service:
  enabled: true
  type: LoadBalancer
  annotations:
    # This tells Hetzner to create/use a specific Load Balancer
    "load-balancer.hetzner.cloud/name": "internet-lb"
    "load-balancer.hetzner.cloud/load-balancer-type": "lb11"
    "load-balancer.hetzner.cloud/location": "fsn1" # Change to your region
    "load-balancer.hetzner.cloud/protocol": "tcp"    # Critical: Pass-through mode
    "load-balancer.hetzner.cloud/uses-proxy-protocol": "true"
# Ensure Traefik can read the Proxy Protocol from Hetzner to see real Client IPs
ports:
  web:
    proxyProtocol:
      trustedIPs: ["127.0.0.1/32", "10.0.0.0/8"] # Internal Hetzner LB range
  websecure:
    proxyProtocol:
      trustedIPs: ["127.0.0.1/32", "10.0.0.0/8"]
