apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: default
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: moodle-cron
            image: ghcr.io/ahmedaa/k3s-moodle:latest
            command: ["php", "/var/www/html/admin/cli/cron.php"]
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
          restartPolicy: OnFailure
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
