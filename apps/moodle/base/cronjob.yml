apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: default
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: moodle-cron
            image: ghcr.io/ahmedaa/k3s-moodle:5.3.0
            command: ["php", "/var/www/html/admin/cli/cron.php"]
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
            - name: moodle-config
              mountPath: /var/www/html/config.php
              subPath: config.php
          restartPolicy: OnFailure
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
          - name: moodle-config
            secret:
              secretName: moodle-config-secret
