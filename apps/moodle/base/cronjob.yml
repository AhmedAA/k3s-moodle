apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: default
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Force Kubernetes to terminate the pod if execution exceeds 120 seconds
      activeDeadlineSeconds: 120
      # Automatically clean up completed/failed pods after 30 seconds
      ttlSecondsAfterFinished: 30
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: moodle-cron
            image: ghcr.io/ahmedaa/k3s-moodle:5.3.3
            command: ["php", "/var/www/html/admin/cli/cron.php"]
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
            - name: moodle-config
              mountPath: /var/www/html/config.php
              subPath: config.php
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
          - name: moodle-config
            secret:
              secretName: moodle-config-secret
