apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: default
spec:
  schedule: "* * * * *"
  # Enforce single execution: Never run overlapping cron runs
  concurrencyPolicy: Forbid
  # Keep cluster history tidy
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Do not retry failed jobs repeatedly; wait for the next minute's run
      backoffLimit: 0
      template:
        spec:
          # Exit immediately on failure instead of looping inside the pod
          restartPolicy: Never
          containers:
          - name: moodle-cron
            image: ghcr.io/ahmedaa/k3s-moodle:5.3.1
            command: ["php", "/var/www/html/admin/cli/cron.php"]
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
            - name: moodle-config
              mountPath: /var/www/html/config.php
              subPath: config.php
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
          - name: moodle-config
            secret:
              secretName: moodle-config-secret
