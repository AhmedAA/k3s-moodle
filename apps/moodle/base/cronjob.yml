apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: default
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 30
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: moodle-cron
            image: ghcr.io/ahmedaa/k3s-moodle:5.3.3
            args:
            - "su"
            - "-s"
            - "/bin/bash"
            - "www-data"
            - "-c"
            - "php /var/www/html/admin/cli/cron.php"
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
            - name: moodle-config
              mountPath: /var/www/html/config.php
              subPath: config.php
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodle-nfs-pvc
          - name: moodle-config
            secret:
              secretName: moodle-config-secret
