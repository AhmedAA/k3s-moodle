apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moodle-ingress
spec:
  tls:
    - hosts:
        - studieportal.maahad.dk
      secretName: tls-secret
  rules:
    - host: studieportal.maahad.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moodle
                port:
                  number: 80
