apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  template:
    spec:
      containers:
      - name: moodle
        volumeMounts:
        - name: vivawallet-volume
          mountPath: /var/www/html/local/vivawallet
      volumes:
      - name: vivawallet-volume
        configMap:
          name: vivawallet-scripts
          defaultMode: 0755
