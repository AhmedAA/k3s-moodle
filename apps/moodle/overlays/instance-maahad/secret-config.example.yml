apiVersion: v1
kind: Secret
metadata:
  name: moodle-config-secret
type: Opaque
stringData:
  config.php: |
    <?php
    $_SERVER['HTTPS'] = 'on';
    $_SERVER['SERVER_PORT'] = 443;

    unset($CFG);
    global $CFG;
    $CFG = new stdClass();

    $CFG->dbtype    = 'mariadb';
    $CFG->dblibrary = 'native';
    $CFG->dbhost    = '10.0.0.3';
    $CFG->dbname    = 'bitnami_moodle';
    $CFG->dbuser    = 'bn_moodle';
    $CFG->dbpass    = 'FIXME';
    $CFG->prefix    = 'mdl_';
    $CFG->dboptions = array (
     'dbpersist' => 0,
     'dbport' => 3306,
     'dbsocket' => '',
     'dbcollation' => 'utf8mb4_general_ci',
    );

    $CFG->wwwroot   = 'https://studieportal.maahad.dk';
    $CFG->dataroot  = '/var/www/moodledata';
    $CFG->admin     = 'admin';
    $CFG->directorypermissions = 02775;
    $CFG->theme = 'academi';

    $CFG->reverseproxy = false;
    $CFG->sslproxy = true;
    $CFG->proxyheaders = 1;

    // VIVA WALLET INTEGRATION
    $CFG->viva_mock_mode   = false;
    $CFG->viva_merchant_id = 'FIXME';
    $CFG->viva_api_key     = 'FIXME';
    $CFG->viva_client_id   = 'FIXME.apps.vivapayments.com';
    $CFG->viva_client_secret = 'FIXME';
    $CFG->viva_source_code = 'FIXME';
    $CFG->viva_api_url     = 'https://api.vivapayments.com';
    $CFG->viva_webhook_key = 'FIXME';

    require_once(__DIR__ . '/lib/setup.php');
