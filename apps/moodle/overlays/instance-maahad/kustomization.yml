apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-ingress.yml
  - path: deployment-patch.yml
  - path: cronjob.patch.yml
configMapGenerator:
  - name: vivawallet-scripts
    namespace: default
    files:
      - vivawallet/gateway.php
      - vivawallet/simulator.php
      - vivawallet/webhook.php
