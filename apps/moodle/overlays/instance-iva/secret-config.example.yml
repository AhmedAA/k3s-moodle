apiVersion: v1
kind: Secret
metadata:
  name: moodle-config-secret
type: Opaque
stringData:
  config.php: |
    <?php
    $_SERVER['HTTPS'] = 'on';
    $_SERVER['SERVER_PORT'] = 443;

    unset($CFG);
    global $CFG;
    $CFG = new stdClass();

    $CFG->dbtype    = 'mariadb';
    $CFG->dblibrary = 'native';
    $CFG->dbhost    = '10.0.0.3';
    $CFG->dbname    = 'bitnami_moodle';
    $CFG->dbuser    = 'bn_moodle';
    $CFG->dbpass    = 'FIXME';
    $CFG->prefix    = 'mdl_';
    $CFG->dboptions = array (
     'dbpersist' => 0,
     'dbport' => 3306,
     'dbsocket' => '',
     'dbcollation' => 'utf8mb4_general_ci',
    );

    $CFG->wwwroot   = 'https://akademi.islamiskviden.org';
    $CFG->dataroot  = '/var/www/moodledata';
    $CFG->admin     = 'admin';
    $CFG->directorypermissions = 02775;

    $CFG->reverseproxy = false;
    $CFG->sslproxy = true;
    $CFG->proxyheaders = 1;

    require_once(__DIR__ . '/lib/setup.php');
