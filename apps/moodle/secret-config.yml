apiVersion: v1
kind: Secret
metadata:
  name: moodle-config-secret
  namespace: default
type: Opaque
stringData:
  config.php: |
    <?php
    unset($CFG);
    global $CFG;
    $CFG = new stdClass();

    $CFG->dbtype    = 'mariadb';
    $CFG->dblibrary = 'native';
    $CFG->dbhost    = '10.0.0.3';
    $CFG->dbname    = 'bitnami_moodle';
    $CFG->dbuser    = 'bn_moodle';
    $CFG->dbpass    = 'YOUR_REDACTED_PASSWORD';
    $CFG->prefix    = 'mdl_';
    $CFG->dboptions = array (
      'dbpersist' => 0,
      'dbport' => 3306,
      'dbsocket' => '',
      'dbcollation' => 'utf8mb4_unicode_ci',
    );

    $CFG->wwwroot   = 'https://studieportal.maahad.dk';
    $CFG->dataroot  = '/var/www/moodledata';
    $CFG->admin     = 'admin';
    $CFG->directorypermissions = 0777;

    // Critical for Traefik proxying Let's Encrypt correctly
    $CFG->sslproxy  = true;
    $CFG->reverseproxy = true;

    require_once(__DIR__ . '/lib/setup.php');
